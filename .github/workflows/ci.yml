name: CI

# === SECTION: triggers (managed) ===
# Source: operator CI policy — integration push = blocking CI only;
# main push/PR (non-draft) = blocking CI; draft and other branches = none.
"on":
  push:
    branches:
      - dev
      - develop
      - 0.12.0-dev
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
# End SECTION: triggers

# === SECTION: permissions (managed) ===
# Source: template (minimal read-only permissions)
permissions:
  contents: read
# End SECTION: permissions

# Why: one active run per workflow and branch prevents obsolete CI from consuming runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Stage 0 — Classification
  # ===========================================================================

  changes:
    name: Detect Changes
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'crates/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            docs:
              - 'docs/**'
              - 'scripts/docs/**'
            ci:
              - '.github/workflows/ci.yml'
              - '.github/setup-ci.sh'
              - 'Makefile'
              - 'makefiles/*.mk'
              - 'scripts/lib/mcb.sh'

  classify:
    name: Classify PR
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      is_draft: ${{ steps.classify.outputs.is_draft }}
      is_bot: ${{ steps.classify.outputs.is_bot }}
      is_fork: ${{ steps.classify.outputs.is_fork }}
      run_full: ${{ steps.classify.outputs.run_full }}
      run_simplified: ${{ steps.classify.outputs.run_simplified }}
    steps:
      - name: Classify PR Type
        id: classify
        env:
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft || 'false' }}
          IS_BOT: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.type == 'Bot' || 'false' }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork || 'false' }}
        run: |
          {
            echo "is_draft=${IS_DRAFT}"
            echo "is_bot=${IS_BOT}"
            echo "is_fork=${IS_FORK}"
          } >> "$GITHUB_OUTPUT"

          if [[ "${IS_DRAFT}" == "false" && "${IS_BOT}" == "false" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "run_simplified=false" >> "$GITHUB_OUTPUT"
          elif [[ "${IS_BOT}" == "true" || "${IS_DRAFT}" == "true" ]]; then
            echo "run_full=false" >> "$GITHUB_OUTPUT"
            echo "run_simplified=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_full=false" >> "$GITHUB_OUTPUT"
            echo "run_simplified=false" >> "$GITHUB_OUTPUT"
          fi

  # ===========================================================================
  # Stage 1 — Fast Checks (all parallel, ~5 min)
  # ===========================================================================

  lint:
    name: Lint (Rust 2024)
    timeout-minutes: 10
    needs: [changes, classify]
    if: |
      (needs.changes.outputs.src == 'true' || needs.changes.outputs.ci == 'true') &&
      ((needs.classify.outputs.run_full == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch') ||
      needs.classify.outputs.run_simplified == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - run: bash .github/setup-ci.sh
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-ubuntu-stable
          save-if: true
          cache-on-failure: true
      - uses: taiki-e/install-action@v2 # prebuilt typos-cli
        with:
          tool: typos
      - run: typos
      - run: make check WHAT=lint

  audit:
    name: Security Audit
    timeout-minutes: 25
    needs: [changes, classify]
    if: >-
      (needs.changes.outputs.src == 'true' || needs.changes.outputs.ci == 'true') &&
      (needs.classify.outputs.run_full == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - run: bash .github/setup-ci.sh --install-audit
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-ubuntu-stable
          save-if: true
          cache-on-failure: true
      - run: make check WHAT=audit

  validate-docs:
    name: Validate Documentation
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [changes, classify]
    if: >-
      (needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true') &&
      (needs.classify.outputs.run_full == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - run: make docs WHAT=check
      - run: bash .github/setup-ci.sh
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: ./.github/actions/native-deps
      - run: |
          sudo apt-get update
          sudo apt-get install -y nodejs npm
          npm install -g markdownlint-cli
      - run: make docs WHAT=check
      - run: make docs WHAT=validate QUICK=1

  docs-diagrams:
    name: Generate Diagrams
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [changes, classify]
    if: >-
      (needs.changes.outputs.docs == 'true' || needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.ci == 'true') &&
      (needs.classify.outputs.run_full == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Install PlantUML
        run: sudo apt-get update && sudo apt-get install -y plantuml
      - run: make docs WHAT=diagrams
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-diagrams
          path: docs/architecture/diagrams/generated/
          retention-days: 30
          include-hidden-files: false

  # ===========================================================================
  # Stage 2a — Primary Test Gate (reuses lint cache, ~8 min)
  # ===========================================================================

  test-linux:
    name: Test (ubuntu-latest, Rust stable)
    needs: [changes, classify, lint]
    if: |
      (needs.changes.outputs.src == 'true' || needs.changes.outputs.ci == 'true') &&
      ((needs.classify.outputs.run_full == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch') ||
      needs.classify.outputs.run_simplified == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - run: bash .github/setup-ci.sh
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-ubuntu-stable
          save-if: true
          cache-on-failure: true
      - name: Cache fastembed models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mcb/fastembed
          key: fastembed-${{ runner.os }}-allminilml6v2-v1
          restore-keys: |
            fastembed-${{ runner.os }}-
      - uses: ./.github/actions/warm-fastembed
      - uses: taiki-e/install-action@v2 # prebuilt binary; make test auto-uses nextest
        with:
          tool: nextest
      - name: Startup Smoke (DDL/Init)
        run: make test SCOPE=startup THREADS=4
        env:
          FASTEMBED_CACHE_DIR: .cache/mcb/fastembed
      - name: Full Test Suite
        run: make test THREADS=4
        env:
          FASTEMBED_CACHE_DIR: .cache/mcb/fastembed

  # ===========================================================================
  # Stage 2b — Extended Testing (after linux stable, all parallel)
  # ===========================================================================

  test-cross:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    needs: [changes, classify, test-linux]
    if: |
      (needs.changes.outputs.src == 'true' || needs.changes.outputs.ci == 'true') &&
      (needs.classify.outputs.run_full == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    # Per-leg timeout: macOS/beta finish in ~10-25min (fail-fast at 120). Windows
    # nextest is process-per-test and the full 1715-test suite runs ~115min+ even
    # with a warm rust-cache (process-spawn overhead, not compile) — at 120 it was
    # cancelled mid-run on consecutive runs. 240 gives the Windows leg headroom to
    # complete the full suite (coverage stays universal across platforms).
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 240 || 120 }}
    continue-on-error: ${{ matrix.rust == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: beta
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: bash .github/setup-ci.sh
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PROTOC_VERSION: "29.3"
          PROTOC_SHA256: "57ea59e9f551ad8d71ffaa9b5cfbe0ca1f4e720972a1db7ec2d12ab44bff9383"
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .
          git fetch --no-tags --prune --no-recurse-submodules --depth=1 origin +${{ github.sha }}:refs/remotes/origin/temp
          git checkout ${{ github.sha }}
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Per-OS cache that SAVES — previously test-cross had no shared-key and
          # save-if:false, so macOS/Windows/beta rebuilt 100% cold every run (the
          # 60-min timeout cause).
          shared-key: ci-cross-${{ matrix.os }}
          save-if: true
          cache-on-failure: true
      - name: Cache FastEmbed models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mcb/fastembed
          key: fastembed-${{ runner.os }}-allminilml6v2-v1
          restore-keys: |
            fastembed-${{ runner.os }}-
      - uses: ./.github/actions/warm-fastembed
      - uses: taiki-e/install-action@v2 # prebuilt binary; make test auto-uses nextest
        with:
          tool: nextest
      - name: Run tests (Windows — unit + startup only)
        if: runner.os == 'Windows'
        run: |
          make test SCOPE=unit THREADS=4
          make test SCOPE=startup THREADS=4
        env:
          FASTEMBED_CACHE_DIR: .cache/mcb/fastembed
      - name: Run tests (Unix — full suite)
        if: runner.os != 'Windows'
        run: make test THREADS=4
        env:
          FASTEMBED_CACHE_DIR: .cache/mcb/fastembed

  validate:
    name: Architecture Validation
    needs: [changes, classify, lint]
    if: |
      (needs.changes.outputs.src == 'true' || needs.changes.outputs.ci == 'true') &&
      ((needs.classify.outputs.run_full == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch') ||
      needs.classify.outputs.run_simplified == 'true')
  # === SECTION: ci job (managed) ===
  # Source: template + config:github_actions.*
  ci:
    name: ci
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: Y
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - run: bash .github/setup-ci.sh
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          submodules: false
          fetch-depth: 0

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - run: bash .github/setup-ci.sh
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-ubuntu-stable
          save-if: true
          cache-on-failure: true
      - name: Cache fastembed models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mcb/fastembed
          key: fastembed-${{ runner.os }}-allminilml6v2-v1
          restore-keys: |
            fastembed-${{ runner.os }}-
      - uses: ./.github/actions/warm-fastembed
      - uses: taiki-e/install-action@v2 # prebuilt binary; make test auto-uses nextest
        with:
          tool: nextest
      - run: make test SCOPE=golden THREADS=2
        env:
          FASTEMBED_CACHE_DIR: .cache/mcb/fastembed

  coverage:
    name: Coverage
    needs: [changes, classify, test-linux]
    if: |
      (needs.changes.outputs.src == 'true' || needs.changes.outputs.ci == 'true') &&
      (needs.classify.outputs.run_full == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch') &&
      needs.classify.outputs.is_fork == 'false'
    runs-on: ubuntu-latest
    # 90 (not 60): tarpaulin recompiles the workspace with its own instrumented
    # RUSTFLAGS in a separate target-dir, so the cold seeding run exceeds 60 min.
    # Measured: a 60-min cap cancelled it mid-run before its cache could save.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - run: bash .github/setup-ci.sh --install-coverage
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Coverage uses tarpaulin (RUSTFLAGS --cfg=tarpaulin -Clink-dead-code) which
          # can't reuse the normal build cache — isolate it on its own key + saver so
          # it doesn't thrash the lint/test cache.
          shared-key: ci-coverage
          save-if: true
          cache-on-failure: true
      - name: Cache fastembed models (coverage)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0

      - name: Install mise toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4.2.3

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: false
      - name: Restore testmon cache
        id: testmon-restore
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            .testmondata
          key: testmon-v1-${{ runner.os }}-${{ runner.arch }}-py3.13-${{ hashFiles('uv.lock', '**/uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            testmon-v1-${{ runner.os }}-${{ runner.arch }}-py3.13-${{ hashFiles('uv.lock', '**/uv.lock') }}-
            testmon-v1-${{ runner.os }}-${{ runner.arch }}-py3.13-


      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: bash .github/setup-ci.sh
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PROTOC_VERSION: "29.3"
          PROTOC_SHA256: "57ea59e9f551ad8d71ffaa9b5cfbe0ca1f4e720972a1db7ec2d12ab44bff9383"
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .
          git fetch --no-tags --prune --no-recurse-submodules --depth=1 origin +${{ github.sha }}:refs/remotes/origin/temp
          git checkout ${{ github.sha }}
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/native-deps
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          shared-key: ci-release-${{ matrix.os }}
          save-if: true
          cache-on-failure: true
      - run: make build RELEASE=1
      - name: Create dist directory
        run: mkdir -p dist
      - name: Copy artifact (Unix)
        if: runner.os != 'Windows'
        env:
          ARTIFACT: ${{ matrix.artifact_name }}
          ASSET: ${{ matrix.asset_name }}
        run: cp "target/release/$ARTIFACT" "dist/$ASSET"
      - name: Copy artifact (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item "target\release\${{ matrix.artifact_name }}" "dist\${{ matrix.asset_name }}"
        shell: pwsh
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-${{ matrix.target }}
          path: dist/${{ matrix.asset_name }}
          retention-days: 7
          include-hidden-files: false

  # ===========================================================================
  # Gate — Consolidated PR Check (required status check)
  # ===========================================================================

  rust-ci:
    name: Rust CI (PR consolidated)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      - changes
      - classify
      - lint
      - test-linux
      - test-cross
      - validate
      - audit
      - golden-tests
      - coverage
      - release-build
    if: always()
    steps:
      - name: Evaluate Required Checks
        env:
          IS_DRAFT: ${{ needs.classify.outputs.is_draft }}
          IS_BOT: ${{ needs.classify.outputs.is_bot }}
          RUN_FULL: ${{ needs.classify.outputs.run_full }}
          RUN_SIMPLIFIED: ${{ needs.classify.outputs.run_simplified }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_LINUX_RESULT: ${{ needs.test-linux.result }}
          TEST_CROSS_RESULT: ${{ needs.test-cross.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          GOLDEN_RESULT: ${{ needs.golden-tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          RELEASE_BUILD_RESULT: ${{ needs.release-build.result }}
        run: |
          echo "=== PR Classification ==="
          echo "Is Draft: $IS_DRAFT | Is Bot: $IS_BOT"
          echo "Run Full: $RUN_FULL | Run Simplified: $RUN_SIMPLIFIED"
          echo ""
          echo "=== Job Results ==="
          echo "Lint:          $LINT_RESULT"
          echo "Test Linux:    $TEST_LINUX_RESULT"
          echo "Test Cross:    $TEST_CROSS_RESULT"
          echo "Validate:      $VALIDATE_RESULT"
          echo "Audit:         $AUDIT_RESULT"
          echo "Golden:        $GOLDEN_RESULT"
          echo "Coverage:      $COVERAGE_RESULT"
          echo "Release Build: $RELEASE_BUILD_RESULT"
          echo ""

          if [[ "$RUN_SIMPLIFIED" == "true" ]]; then
            echo "=== Simplified Suite Policy (Draft/Bot PR) ==="
            FAILED=0
            for job in LINT_RESULT TEST_LINUX_RESULT VALIDATE_RESULT; do
              result="${!job}"
              if [[ "$result" != "success" && "$result" != "skipped" ]]; then
                echo "✗ $job: $result"
                FAILED=1
              fi
            done
            if [[ $FAILED -eq 1 ]]; then
              echo "✗ Simplified checks failed"
              exit 1
            fi
            echo "✓ Simplified checks passed"
            exit 0
          fi

          if [[ "$RUN_FULL" == "true" ]]; then
            echo "=== Full Suite Policy (Human Ready PR) ==="
            FAILED=0
            # Coverage is ADVISORY, not required: it is a metric (not a correctness
            # gate) and cargo-tarpaulin's default ptrace engine intermittently aborts
            # with "Test failed during run" on multi-threaded/tokio test binaries even
            # when every test passes. Correctness is already enforced by the gates
            # below. Root-cause engine fix tracked in mcb-xgji; advisory policy mcb-xku4.
            for job in LINT_RESULT TEST_LINUX_RESULT TEST_CROSS_RESULT \
                       VALIDATE_RESULT AUDIT_RESULT GOLDEN_RESULT \
                       RELEASE_BUILD_RESULT; do
              result="${!job}"
              if [[ "$result" != "success" && "$result" != "skipped" ]]; then
                echo "✗ $job: $result"
                FAILED=1
              fi
            done

            if [[ "$COVERAGE_RESULT" != "success" && "$COVERAGE_RESULT" != "skipped" ]]; then
              echo "⚠ Coverage: $COVERAGE_RESULT (advisory — does not block merge; see mcb-xku4)"
            fi

            if [[ $FAILED -eq 1 ]]; then
              echo "✗ Full suite check failed"
              exit 1
            fi

      - name: setup (blocking)
        # Why (mro-v4p5): explicit CI=Y on every make invocation (job env is not enough for matrix/docker parity).
        run: CI=Y make setup

      - name: gen (blocking)
        # Why (mro-v4p5): explicit CI=Y on every make invocation (job env is not enough for matrix/docker parity).
        run: CI=Y make gen WHAT=apply APPLY=Y

      - name: fmt (blocking)
        # Why (mro-v4p5): explicit CI=Y on every make invocation (job env is not enough for matrix/docker parity).
        run: CI=Y make fmt WHAT=apply APPLY=Y

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3.28.13
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql-config.yml
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3.28.13
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3.28.13
        with:
          category: "/language:${{ matrix.language }}"

- name: fix (blocking)
        # Why (mro-v4p5): explicit CI=Y on every make invocation (job env is not enough for matrix/docker parity).
        run: CI=Y make fix WHAT=apply APPLY=Y

      - name: check (blocking)
        # Why (mro-v4p5): explicit CI=Y on every make invocation (job env is not enough for matrix/docker parity).
        run: CI=Y make check

      - name: Dump reports on failure
        if: ${{ failure() }}
        run: |
          set -eu
          # Structured reports only — same allowlist as Upload reports (no raw
          # pytest/tool logs: those may carry connection strings / env secrets).
          while IFS= read -r -d '' f; do
            echo "::group::$f"
            tail -n 200 "$f"
            echo "::endgroup::"
          done < <(
            find .reports apps \
              \( -path '*/junit.xml' -o -path '*/coverage.xml' -o -path '*/coverage.json' \) \
              -type f -print0 2>/dev/null || true
          )
      - name: Upload reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: flext-ci-reports-${{ github.run_id }}
          # Structured reports only — omit raw pytest/tool logs that may carry
          # connection strings or env-derived secrets from integration fixtures.
          path: |
            .reports/**/junit.xml
            .reports/**/coverage.xml
            .reports/**/coverage.json
            apps/*/.reports/**/junit.xml
            apps/*/.reports/**/coverage.xml
            apps/*/.reports/**/coverage.json
          if-no-files-found: ignore
          retention-days: 7
    # End SECTION: ci job
