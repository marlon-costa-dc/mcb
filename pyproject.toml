[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcb-scripts"
version = "0.3.2"
description = "Repository-local automation helpers for MCB"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]
gitops = [
    "hvac",
    "kubernetes",
    "kubernetes-validate",
    "requests",
    "ruamel.yaml",
]

[tool.setuptools]
packages = []

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    # xtask-bound migration lane (mcb-rt1j); do not Pythonize in this workstream.
    "scripts/codegen-conversions.py",
    "scripts/codegen-post-process.py",
    "scripts/extract-migration-sql.py",
]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "scripts"
files = [
    "scripts/check",
    "scripts/lib",
    "scripts/qlty",
]
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "qlty.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = [
    "scripts/lib/tests",
    "scripts/qlty/tests",
]
